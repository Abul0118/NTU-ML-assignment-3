name: transformer_unet_ssl_aug

transform:
  resized_imaged:
    height: 224
    width: 224

  # AUGMENTATION BLOCK
  augment:
    horizontal_flip: true
    vertical_flip: false
    rotate: true
    brightness: 0.15
    contrast: 0.15
    gaussian_noise: true

train_dataset:
  data_dir: dataset/train
  has_label: true

valid_dataset:
  data_dir: dataset/train
  has_label: true

train_loader:
  batch_size: 8
  num_workers: 0
  shuffle: true

valid_loader:
  batch_size: 1
  num_workers: 0
  shuffle: false

optimizer:
  lr: 0.0001

trainer:
  n_epoch: 50

checkpoint:
  path: checkpoints/transformer_unet_ssl_aug_best.pth
