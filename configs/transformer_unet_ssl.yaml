name: transformer_unet_ssl

transform:
  resized_imaged:
    height: 224
    width: 224

train_dataset:
  data_dir: dataset/train
  has_label: true

valid_dataset:
  data_dir: dataset/train
  has_label: true

train_loader:
  batch_size: 8
  num_workers: 0
  shuffle: true

valid_loader:
  batch_size: 1
  num_workers: 2
  shuffle: false

optimizer:
  lr: 0.0001 # smaller LR for fine-tuning SSL

trainer:
  n_epoch: 50

checkpoint:
  path: checkpoints/transformer_unet_ssl_best.pth
