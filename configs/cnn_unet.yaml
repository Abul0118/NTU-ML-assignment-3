name: cnn_unet

transform:
  resized_imaged:
    # Final training resolution — fits Colab & assignment
    height: 256
    width: 256

train_dataset:
  data_dir: dataset/train     # do NOT add /image here — assignment code handles keys
  has_label: true

valid_dataset:
  data_dir: dataset/train
  has_label: true

train_loader:
  batch_size: 8               # CPU/Colab friendly
  num_workers: 2              # Must be 0 in Colab
  shuffle: true

valid_loader:
  batch_size: 1
  num_workers: 0
  shuffle: false

optimizer:
  lr: 0.001                   # Better for UNet-small on CPU

trainer:
  n_epoch: 5                 # 100 too long on CPU; you can resume later

checkpoint:
  path: checkpoints/cnn_unet_best.pth
