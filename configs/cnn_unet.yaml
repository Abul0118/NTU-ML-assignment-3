name: cnn_unet

transform:
  resized_imaged:
    height: 256
    width: 256

train_dataset:
  data_dir: dataset/train
  has_label: true

valid_dataset:
  data_dir: dataset/train
  has_label: true

train_loader:
  batch_size: 4       # Heavy UNet → reduce batch to avoid CUDA OOM
  num_workers: 4
  shuffle: true

valid_loader:
  batch_size: 1
  num_workers: 0
  shuffle: false

optimizer:
  lr: 0.0005          # Lower LR = smoother convergence for large UNet

trainer:
  n_epoch: 80         # Heavy UNet needs longer training (80 is safe)

checkpoint:
  path: checkpoints/cnn_unet_best.pth
